<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
    <meta name="theme-color" content="#0a051b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Money Tracker Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=2.0.0">
</head>
<body>
    <div class="bg-blur-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- LOGIN SCREEN CONTAINER -->
    <main id="login-screen" class="screen active"></main>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="screen">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass">
            <div class="sidebar-brand">
                <i data-lucide="wallet" class="brand-icon"></i>
                <span>Money Tracker</span>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="overview">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </button>
                <button class="nav-item" data-tab="transactions">
                    <i data-lucide="arrow-left-right"></i>
                    <span>Transactions</span>
                </button>
                <button class="nav-item" data-tab="food">
                    <i data-lucide="apple"></i>
                    <span>Food Tracker</span>
                </button>
                <button class="nav-item" data-tab="insights">
                    <i data-lucide="trending-up"></i>
                    <span>Insights</span>
                </button>
                <button class="nav-item" data-tab="stories">
                    <i data-lucide="notebook-pen"></i>
                    <span>Story</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i data-lucide="log-out"></i>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <!-- Header -->
            <header class="main-header">
                <div class="header-title">
                    <h1 id="welcome-message">Financial Overview</h1>
                    <p>Track, manage, and analyze your transactions</p>
                </div>
                <div class="header-actions">
                    <button id="quick-ai-modal-btn" class="btn btn-secondary">
                        <i data-lucide="sparkles"></i> <span class="btn-label">Quick AI Parse</span>
                    </button>
                    <button id="quick-add-btn" class="btn btn-primary">
                        <i data-lucide="plus"></i> <span class="btn-label">Add Transaction</span>
                    </button>
                </div>
            </header>

            <!-- DEDICATED TAB CONTAINERS -->
            <section id="tab-overview" class="tab-pane active"></section>
            <section id="tab-transactions" class="tab-pane"></section>
            <section id="tab-food" class="tab-pane"></section>
            <section id="tab-insights" class="tab-pane"></section>
            <section id="tab-stories" class="tab-pane"></section>
        </main>
    </div>

    <!-- DEDICATED MODALS CONTAINER -->
    <div id="modals-container"></div>

    <!-- BOTTOM NAV BAR FOR MOBILE -->
    <nav class="bottom-nav glass">
        <button class="bottom-nav-item active" data-tab="overview">
            <i data-lucide="layout-dashboard"></i>
            <span>Overview</span>
        </button>
        <button class="bottom-nav-item" data-tab="transactions">
            <i data-lucide="arrow-left-right"></i>
            <span>Txns</span>
        </button>
        <button class="bottom-nav-item" data-tab="food">
            <i data-lucide="apple"></i>
            <span>Food</span>
        </button>
        <button class="bottom-nav-item" data-tab="insights">
            <i data-lucide="trending-up"></i>
            <span>Insights</span>
        </button>
        <button class="bottom-nav-item" data-tab="stories">
            <i data-lucide="notebook-pen"></i>
            <span>Story</span>
        </button>
        <button class="bottom-nav-item" id="mobile-logout-btn">
            <i data-lucide="log-out"></i>
            <span>Exit</span>
        </button>
    </nav>

    <!-- App Script -->
    <script src="app.js?v=2.0.0"></script>
</body>
</html>
