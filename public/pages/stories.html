<div class="table-controls glass" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
        <h3 style="font-size: 18px; font-weight: 700;">My Stories</h3>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 2px;">Capture your daily moments and diary updates</p>
    </div>
    <button id="quick-add-story-btn" class="btn btn-primary">
        <i data-lucide="plus"></i> New Story
    </button>
</div>

<div id="stories-grid" class="stories-grid mt-4">
    <!-- Dynamic story cards -->
</div>

<div id="stories-empty" class="stories-empty glass" style="display: none;">
    <i data-lucide="notebook-pen" style="width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.4;"></i>
    <h3>No stories yet</h3>
    <p>Start your first diary entry today!</p>
</div>
