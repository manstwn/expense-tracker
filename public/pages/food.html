<div class="table-controls glass" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
        <h3 style="font-size: 18px; font-weight: 700;">Food Intake Logs</h3>
        <p style="font-size: 13px; color: var(--text-secondary); margin-top: 2px;">Track what you eat throughout the day</p>
    </div>
    <button id="quick-add-food-btn" class="btn btn-primary">
        <i data-lucide="plus"></i> Log Food
    </button>
</div>
<div class="table-container glass mt-4">
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Food</th>
                    <th>Category</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="food-logs-tbody">
                <!-- Dynamic -->
            </tbody>
        </table>
    </div>
</div>
